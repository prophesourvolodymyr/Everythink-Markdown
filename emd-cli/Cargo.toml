[package]
name = "emd-cli"
version = "0.1.0"
edition = "2021"
description = "Everything MarkDown — CLI toolchain"
license = "MIT"
repository = "https://github.com/everthink-co/emd"

[[bin]]
name = "emd"
path = "src/main.rs"

[dependencies]
emd = { path = "../emd" }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
