[package]
name = "emd"
version = "0.1.0"
edition = "2021"
description = "Everything MarkDown — typed, semantic Markdown reference implementation"
license = "MIT"
repository = "https://github.com/everthink-co/emd"
readme = "README.md"
keywords = ["markdown", "parser", "ast", "semantic", "wasm"]
categories = ["parsing", "text-processing", "wasm"]

[lib]
crate-type = ["lib", "cdylib"]
name = "emd"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false }
logos = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
miette = "7"
walkdir = "2"
tiktoken-rs = "0.5"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync", "macros"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["miette-diagnostics"]
miette-diagnostics = []
